:root{--teal:#15506F;--teal2:#0E3A52;--gold:#DCA41F;--gold2:#EFC463;--cream:#FBF3E2;--paper:#FDF9F0;--rose:#CE4E6B;--slate:#8FA8B4;--ink:#26404e;--line:rgba(21,80,111,.16);--insight:#eaf1f6;--try:#fbf2da;--journal:#fbecf1}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:20px 24px 0;display:flex;align-items:center;gap:12px}
header img{height:24px}header .bk{font-size:13px;color:rgba(21,80,111,.6);font-weight:500}
.rail{padding:16px 24px 0;display:flex;gap:5px}
.rail i{height:5px;flex:1;border-radius:3px;background:var(--line)}.rail i.done{background:var(--gold)}.rail i.now{background:var(--teal)}
main{flex:1;padding:14px 24px 24px}
.sesslabel{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#B5831A;font-weight:600}
h1{font-size:26px;font-weight:600;color:var(--teal);margin:4px 0 4px;line-height:1.18}
.subtitle{font-family:Lora,Georgia,serif;font-style:italic;color:var(--rose);font-size:17px;margin:0 0 18px}
.block{border-radius:14px;padding:16px 18px;margin:0 0 20px}
.block .tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.insight{background:var(--insight);border-left:4px solid var(--teal)}.insight .tag{color:var(--teal)}.insight p{margin:0 0 8px;font-size:15px}.insight p:last-child{margin:0}
.reflect .tag{color:var(--teal)}
.try{background:var(--try);border-left:4px solid var(--gold)}.try .tag{color:#9a7415}
.journal{background:var(--journal);border-left:4px solid var(--rose)}.journal .tag{color:var(--rose)}
.journal .prompt{font-family:Lora,Georgia,serif;font-style:italic;font-size:16px;color:var(--teal2);margin:0 0 10px}
.q{margin:0 0 16px}.q label{display:block;font-weight:500;color:var(--teal2);margin-bottom:8px;font-size:16px}.q .n{color:#B5831A;font-weight:700;margin-right:6px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;resize:vertical;min-height:80px;line-height:1.5}
textarea:focus,input:focus{outline:none;border-color:var(--slate)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chk .opt{border:1.5px solid var(--line);border-radius:20px;padding:9px 15px;font-size:14px;background:#fff;cursor:pointer;user-select:none}
.chk .opt.sel{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.helper{font-size:13px;color:rgba(38,64,78,.72);margin:-2px 0 10px}
.chklabel{font-weight:500;color:var(--teal2);margin:2px 0 8px}
.listrow{margin-bottom:8px}.listrow input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:15px;background:#fff}
.addbtn{background:none;border:1.5px dashed var(--slate);color:var(--teal);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;cursor:pointer;margin-top:2px}
.circ{margin:0 0 14px}.circ b{color:var(--teal)}.circ .d{font-size:13px;color:rgba(38,64,78,.7);margin-bottom:6px}
.quote{background:var(--teal);color:var(--cream);border-radius:14px;padding:16px 18px;text-align:center;font-family:Lora,Georgia,serif;font-style:italic;font-size:17px;margin:6px 0 0}
.saveline{font-size:12px;color:var(--slate);text-align:center;padding:6px 0 0}
.nav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 22%);padding:14px 24px 22px;max-width:460px;margin:0 auto;width:100%}
.btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--teal);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line);margin-top:10px;font-weight:500}
</style></head>

<script>/* Roots and Wings — full workbook content, transcribed from the printed workbook.

window.RW_CONTENT = {
teen: [
 { no:1, title:'We All Need a Safe Base', subtitle:'Where do you turn to when things feel too big to hold alone?',
   insight:['Even when you want more independence, you still need safe people to turn to when life becomes too much. That is not weakness. That is human.',
            'Wanting connection does not make you small. It makes you wise. Strong people build strong relationships.'],
   reflect:['Who are the people I feel safest with?','What makes me feel understood?','What makes me pull away from people?'],
   activity:{ title:'Your Circle of Safety', intro:'Add the people you go to when you feel scared, confused, hurt, or proud. This is your circle.',
     people:true, checks:{ label:'Who do you go to when…', options:['When I am scared','When I am confused','When I am hurt','When I am proud of something'] } },
   journal:'When life gets difficult, I usually…', quote:'Safe people are not a luxury. They are a foundation.' },

 { no:2, title:'Understanding My Feelings', subtitle:'What sits underneath what people see?',
   insight:['Every behaviour is connected to a feeling. What we do on the outside is often protecting what we feel on the inside.',
            'Anger often protects sadness. Withdrawal often protects disappointment. Defiance often protects hurt.',
            'Learning to name what is underneath is the beginning of self awareness.'],
   reflect:['Think about your last argument. What feeling was underneath your reaction?'],
   activity:{ title:'What am I really feeling?', intro:'When I act angry, I may actually be feeling:',
     checks:{ options:['Hurt','Embarrassed','Rejected','Lonely','Afraid','Something else'] } },
   journal:'What people usually see is _____. What I am actually feeling is _____.', quote:'Behind every strong reaction is a softer feeling waiting to be understood.' },

 { no:3, title:'Who Am I Becoming?', subtitle:'The person you were, the person you are, and the one taking shape.',
   insight:['Adolescence is a season of discovering who you are and who you are becoming. You do not have to reject your family to become yourself.',
            'Healthy independence grows out of secure relationships, not away from them.'],
   reflect:['What makes me unique?','What values do I want to live by?','What kind of adult do I want to become?'],
   activity:{ title:'Right now, and becoming', intro:'Write a few words that describe the person you are right now, and the person you are becoming.',
     fields:['Right now, I am…','I am becoming…'] },
   journal:'Three things I hope people remember about me are…', quote:'You are not who you were. You are not yet who you will be. You are becoming.' },

 { no:4, title:'Freedom and Responsibility', subtitle:'The two wings that carry each other.',
   insight:['Trust and freedom grow together. The more responsibility you show, the more freedom becomes possible.',
            'Freedom is not the absence of rules. It is the presence of self control.'],
   reflect:['What freedoms do I want right now?','What responsibilities come with those freedoms?'],
   activity:{ title:'Complete each sentence honestly', fields:['When my parents trust me, I feel…','When they do not trust me, I feel…','One way I can earn more trust this month is…'] },
   journal:'The freedom I most want is _____, and the responsibility I am ready to carry for it is _____.', quote:'Every wing must be earned. Every root must be tended.' },

 { no:5, title:'Conflict Without Damage', subtitle:'How to disagree and still belong to each other.',
   insight:['Disagreement is normal. Disconnection is not the goal. Healthy families learn how to stay connected even during conflict.',
            'The aim is not to win. The aim is to understand each other and to protect the relationship while doing so.'],
   reflect:['What is one thing that always makes conflict worse for me?','What is one thing that would make it easier?'],
   activity:{ title:'Two sides of the story', intro:'How do I usually react when I disagree with someone at home?',
     checks:{ options:['Attack','Avoid','Shut down','Explain','Listen','Something else'] },
     fields:['From my side…','From their side…'] },
   journal:'What would change if winning arguments became less important than understanding each other?', quote:'You can disagree and still belong to each other.' },

 { no:6, title:'The Hidden Meaning of Behaviour', subtitle:'What your louder self is trying to say.',
   insight:['Sometimes behaviour is a signal. People often act out because they do not know how to ask for what they need.',
            'Slamming a door may be saying, “I feel unheard.” Shouting may be saying, “I am afraid.” Silence may be saying, “I do not feel safe.”'],
   reflect:['What was I really trying to say?','What was I really needing?'],
   activity:{ title:'Your louder self', intro:'Think of a recent time you did one of the following. What were you hoping would happen?',
     checks:{ options:['Slammed a door','Shouted','Ignored someone','Broke a rule','Went quiet for a long time'] },
     fields:['A short letter from my “louder self” to my “quieter self”…'] },
   journal:'What was I really trying to communicate?', quote:'Behind every behaviour is a need waiting to be named.' },

 { no:7, title:'Belonging and Friendship', subtitle:'The people who help you become yourself.',
   insight:['The need to belong is one of the strongest human needs. Friendships shape how we see ourselves.',
            'Healthy friendships help you grow. Unhealthy ones ask you to shrink or to betray who you are.'],
   reflect:['Which friendships bring out my best self?','Which friendships make me feel unsafe or smaller than I am?','What kind of friend do I want to be to others?'],
   activity:{ title:'Your Friendship Circles', intro:'List the people in each circle.',
     circles3:[['Inner circle','Your closest, safest people'],['Middle circle','Friends you enjoy but do not fully trust yet'],['Outer circle','Acquaintances']] },
   journal:'I feel most accepted when…', quote:'Belong to the people who help you become yourself.' },

 { no:8, title:'Managing Big Emotions', subtitle:'Learning to hold a feeling well.', activityFirst:true,
   insight:['Emotions are messengers, not enemies. Learning to regulate them helps you make wise decisions and protect your relationships.',
            'You do not have to hide what you feel. You only need to hold it well.'],
   activity:{ title:'Your personal regulation plan', intro:'When I am overwhelmed, I will try to:',
     checks:{ options:['Pause and count slowly to ten','Pray or sit quietly','Walk it off','Talk to someone safe','Write it down','Breathe slowly, in for four, out for six','Move my body or exercise','Something else that works for me'] } },
   reflect:['What usually helps me return to myself after a big feeling?','What usually makes it worse?'],
   journal:'What helps me return to myself?', quote:'You are not your storm. You are the sky the storm passes through.' },

 { no:9, title:'Repairing Relationships', subtitle:'The short bridge back to belonging.',
   insight:['Every relationship experiences ruptures. Strong relationships are not perfect. They are the ones that know how to repair.',
            'Repair takes courage. It is often the shortest bridge back to belonging.'],
   reflect:['What would repair look like in a relationship you want to reconnect with?','What is one small step I could take this week?'],
   activity:{ title:'The first two sentences', intro:'Draft the first two sentences of a message or conversation you have been avoiding. You do not have to send it yet. Just write it down.',
     fields:['The first two sentences…'] },
   journal:'What conversation have I been avoiding?', quote:'Repair does not erase the rupture. It builds a stronger bond across it.' },

 { no:10, title:'Roots and Wings', subtitle:'Belonging and becoming are yours to hold together.',
   insight:['Maturity is not choosing between belonging and becoming. It is holding both at the same time.',
            'You can belong and be independent. You can be loved and still be different. Your roots are what allow your wings to open.'],
   reflect:['Looking back at this workbook, what have I learned about myself?','What have I learned about my family?','What have I learned about relationships in general?'],
   activity:{ title:'A letter to your future self', intro:'Begin with the words below and let your heart finish it.',
     fields:['“Dear future me, I hope you never forget…”'] },
   journal:'If I could describe this journey in one sentence, it would be…', quote:'Grow strong roots. Spread your wings. Both belong to you.' }
],

parent: [
 { no:1, title:'The Adolescent Journey', subtitle:'Not detachment. Re-organisation of attachment.',
   insight:['Adolescence is not detachment. It is the re-organisation of attachment.',
            'Your child still needs you, even when they appear not to. What changes is the shape of the need, not its presence.'],
   reflect:['What changes in my teenager worry me most?','What changes excite me?','What do I miss about the child they used to be?'],
   activity:{ title:'What stays the same', intro:'Bring to mind your child at three different ages. Notice what stays the same in them, beneath all the change.',
     fields:['As a child…','As a younger teen…','Now…'] },
   journal:'When my teenager pulls away, I usually…', quote:'The distance is not rejection. It is growth.' },

 { no:2, title:'Seeing Behaviour Through an Attachment Lens', subtitle:'The story beneath the story.',
   insight:['Behaviour often communicates unmet needs. Before asking, “How do I stop this behaviour?” it helps to ask, “What is this behaviour trying to tell me?”',
            'A shift in the question is a shift in the relationship.'],
   reflect:['What is one difficult behaviour my teenager displays that I would like to understand better?','What need might be hidden underneath?','What am I usually reacting to on the surface?'],
   activity:{ title:'The iceberg', intro:'Above the water is what everyone sees. Below the water are the feelings and needs that drive it.',
     fields:['Above the water — the behaviour I see…','Below the water — the feelings and needs underneath…'] },
   journal:'What if this behaviour is a signal rather than a threat?', quote:'What we see is rarely the whole story.' },

 { no:3, title:'Becoming a Secure Base', subtitle:'A safe harbour and a launching pad.', activityFirst:true,
   insight:['Teenagers need a safe harbour and a launching pad. As a parent, you are asked to be both.',
            'A secure base is not a parent who has all the answers. It is a parent who stays available while their child figures things out.'],
   activity:{ title:'When my child struggles', intro:'When my child struggles, I am more likely to:',
     checks:{ options:['Fix it for them','Lecture them','Rescue them from the consequences','Listen and stay near','Withdraw or grow silent','Something else'] } },
   reflect:['Which of the above was modelled for me when I was young?','What would it look like, in our home, to “stay near without taking over”?'],
   journal:'What helps my child feel emotionally safe with me?', quote:'Presence is more powerful than performance.' },

 { no:4, title:'Supporting Autonomy Without Losing Connection', subtitle:'Guidance keeps the door open.',
   insight:['Control creates resistance. Guidance creates growth. Autonomy support means respecting the adolescent’s developing voice while staying warmly involved.',
            'The goal is not to have less influence. It is to have the kind of influence that endures.'],
   reflect:['Where in our relationship do I need to loosen control?','Where do I need to hold firm on boundaries?','What is the difference, for me, between guiding and controlling?'],
   activity:{ title:'Hand over, and hold', intro:'Three decisions your teenager could reasonably start making this month, and one boundary you will not move on.',
     fields:['Decisions I can hand over…','One boundary I will hold…'] },
   journal:'What does healthy freedom look like in our family?', quote:'Guidance keeps the door open. Control locks it from the outside.' },

 { no:5, title:'Understanding Conflict Differently', subtitle:'Disagreement is not the same as damage.',
   insight:['Conflict is not necessarily relationship failure. Conflict often accompanies growth.',
            'What matters is not whether we disagree, but how we return to each other afterwards.'],
   reflect:['How was conflict handled in the family I grew up in?','How does that influence the way I handle it now?','What is my automatic response when my child disagrees with me?'],
   activity:{ title:'Narrate it to a wise friend', intro:'Recall the last argument you had with your teenager. Write it down as if you were narrating it to a wise friend. Then read it back.',
     fields:['The argument, told to a wise friend…'] },
   journal:'When my child disagrees with me, I feel…', quote:'Conflict is not the enemy of connection. Silence often is.' },

 { no:6, title:'Intergenerational Patterns', subtitle:'What ends with you can free those who come after.',
   insight:['Many of our parenting reactions do not begin with our child. They begin with our own attachment history.',
            'Unhealed wounds often reappear in the next generation, unless someone chooses to become aware.'],
   reflect:['What messages did I receive growing up about emotions?','What messages did I receive about obedience?','What messages did I receive about independence?','What messages did I receive about making mistakes?'],
   activity:{ title:'Kept, and ended', intro:'One pattern you inherited that you are grateful for, and one you want to stop passing on.',
     fields:['Grateful for…','Stopping with me…'] },

<script>
function qp(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}
var SUPABASE_URL="https://vkgdanlxnvwzamhtlwxh.supabase.co";
var SUPABASE_KEY="sb_publishable_CRHfLHVPmL_z7XYKX1JZOQ_uhqOAWSF";
function LS(){try{return window.localStorage}catch(e){return null}}
function lsGet(k){var s=LS();try{return s?s.getItem(k):null}catch(e){return null}}
var role=(window.__role)||qp('role')||lsGet('rw_role')||'teen';
var CODE=qp('code')||lsGet('rw_code')||'';
function sbc(){return (window.supabase&&CODE)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'rw-'+role}}):null;}
var si=(window.__s!==undefined)?window.__s:(parseInt(qp('s')||'1',10)-1);
var LIST=RW_CONTENT[role]; var S=LIST[si];
var A={}; /* answers, would load from row */
document.getElementById('track').textContent = role==='teen'?'Part One · for you':'Part Two · for parents';
document.getElementById('rail').innerHTML = LIST.map(function(_,i){return '<i class="'+(i<si?'done':(i===si?'now':''))+'"></i>';}).join('');

function esc(s){return s;}
function taField(q,ph){return '<textarea data-q="'+q+'" placeholder="'+(ph||'')+'"></textarea>';}
function activityHTML(a){
  var h = a.intro?'<p class="helper">'+a.intro+'</p>':'';
  if(a.people){
    h+='<div id="ppl">'+[0,1,2].map(function(i){return '<div class="listrow"><input type="text" data-q="p'+i+'" placeholder="A name"></div>';}).join('')+'</div>';
    h+='<button class="addbtn" type="button" id="addp">+ Add a person</button>';
  }
  if(a.checks){
    if(a.checks.label) h+='<p class="chklabel">'+a.checks.label+'</p>';
    h+='<div class="chk" data-cq="c">'+a.checks.options.map(function(o){return '<div class="opt">'+o+'</div>';}).join('')+'</div>';
  }
  if(a.fields){ h+=a.fields.map(function(f,i){return '<div class="q"><label>'+f+'</label>'+taField('f'+i,'')+'</div>';}).join(''); }
  if(a.circles3){ h+=a.circles3.map(function(c,i){return '<div class="circ"><b>'+c[0]+'</b><div class="d">'+c[1]+'</div>'+taField('circ'+i,'One name per line…')+'</div>';}).join(''); }
  return h;
}
function reflectHTML(){ return '<div class="block reflect"><div class="tag">Reflection</div>'+
  S.reflect.map(function(q,i){return '<div class="q"><label><span class="n">'+(i+1)+'.</span>'+q+'</label>'+taField('r'+i,'Take your time…')+'</div>';}).join('')+'</div>'; }
function activityBlock(){ return '<div class="block try"><div class="tag">Try this — '+S.activity.title+'</div>'+activityHTML(S.activity)+'</div>'; }

function render(){
  var m=document.getElementById('main');
  var parts='';
  parts+='<div class="sesslabel">Session '+S.no+' of 10</div><h1>'+S.title+'</h1><p class="subtitle">'+S.subtitle+'</p>';
  parts+='<div class="block insight"><div class="tag">Insight</div>'+S.insight.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  if(S.activityFirst){ parts+=activityBlock(); if(S.reflect)parts+=reflectHTML(); }
  else { if(S.reflect)parts+=reflectHTML(); parts+=activityBlock(); }
  if(!S.noJournal && S.journal){ parts+='<div class="block journal"><div class="tag">Journal prompt</div><p class="prompt">“'+S.journal+'”</p>'+taField('journal','Write freely…')+'</div>'; }
  parts+='<div class="quote">'+S.quote+'</div><p class="saveline" id="saveline">saved to your workbook</p>';

  var ab=m.querySelector('#addp'); if(ab) ab.onclick=function(){ var d=document.createElement('div'); d.className='listrow'; d.innerHTML='<input type="text" placeholder="A name">'; document.getElementById('ppl').appendChild(d); };
}
var st=null;
function persist(finished){
  var c=sbc(); if(!c){ var sl=document.getElementById('saveline'); if(sl)sl.textContent='not saved — no connection'; return; }
  c.rpc('save_answers',{p_code:CODE,p_role:role,p_session:'s'+S.no,p_data:A,p_finished:!!finished}).then(function(res){
    var sl=document.getElementById('saveline'); if(!sl)return;
    sl.textContent = res.error ? ('not saved ('+res.error.message+')') : 'saved to your workbook';
  });
}
function save(){ var s=document.getElementById('saveline'); if(s)s.textContent='saving…'; clearTimeout(st); st=setTimeout(function(){persist(false);},700); }

};
var pv=nav.querySelector('#prev'); if(pv) pv.onclick=function(){ location.href='?role='+role+'&code='+encodeURIComponent(CODE)+'&s='+(S.no-1); };
